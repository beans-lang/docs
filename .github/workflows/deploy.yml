# Build the Beans documentation site, run its checks, and deploy to GitHub Pages.
#
# This workflow lives in the docs repository. It only builds and publishes the
# static docs. It never runs the compiler's own CI, tests, or release jobs.
name: Deploy docs

on:
  push:
    branches: [main]
    # Run only when website source, the coverage tooling, or this workflow change.
    # (The upstream doc source — the Beans compiler and stdlib — lives in a
    # separate repository; use the manual trigger below to rebuild after it moves.)
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'data/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Least privilege: read the repo, write Pages, and mint the deploy token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; cancel an in-progress run when a newer one starts.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      # The coverage check reads the public Beans source to build its inventory:
      # the stdlib packages, the self-hosted checker (compiler/beans), and the
      # builtin type registry. Everything it needs is in this public checkout;
      # the private bootstrap submodule is not required.
      - name: Checkout Beans compiler (coverage source)
        uses: actions/checkout@v4
        with:
          repository: beans-lang/beans
          path: beans-src

      # A release beansc is required so the example check actually compiles the
      # examples and doc snippets. The job fails if it cannot be installed.
      - name: Install beansc
        run: |
          curl -fsSL https://github.com/beans-lang/beans/releases/latest/download/beans-install.sh | sh
          echo "$HOME/.beans/bin" >> "$GITHUB_PATH"

      - name: Verify beansc is available
        run: |
          "$HOME/.beans/bin/beansc" --version

      # The docs follow compiler main, which can be newer than the latest
      # release. Use the release compiler only to bootstrap the current
      # self-hosted compiler, then validate snippets with that current build.
      - name: Build current beansc
        run: |
          "$HOME/.beans/bin/beansc" build \
            beans-src/compiler/beans/main.b \
            -o "$RUNNER_TEMP/beansc-docs"
          "$RUNNER_TEMP/beansc-docs" --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Signature extractor tests
        env:
          BEANS_REPO: ${{ github.workspace }}/beans-src
        run: npm run test:signatures

      - name: Coverage check
        env:
          BEANS_REPO: ${{ github.workspace }}/beans-src
        run: npm run coverage

      - name: Link check
        run: npm run links

      - name: Build site
        env:
          # Project page base path for GitHub Pages
          # (https://beans-lang.github.io/docs/).
          BASE: /docs
        run: npm run build

      - name: Example check
        env:
          BEANS_REPO: ${{ github.workspace }}/beans-src
          BEANSC: ${{ runner.temp }}/beansc-docs
          # Type-check the docs against the same main-branch stdlib as the
          # source inventory, even when the latest release is older than main.
          BEANS_STDLIB: ${{ github.workspace }}/beans-src/stdlib/std
          # Fail (do not skip) if beansc is somehow unavailable in CI.
          REQUIRE_BEANSC: '1'
        run: npm run examples

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
